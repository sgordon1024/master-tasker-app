# Runs on every push to main and on every pull request. See "CI" in CONTRIBUTING.md.
# Mac only on purpose: the app, its install scripts and several tests need macOS (zsh, BSD tools, PlistBuddy, plutil).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: macos-latest
    timeout-minutes: 30
    # Nothing in a test run should reach for this machine's Claude or pop up a Mac notification.
    # The tests already point both at stand-ins. This keeps any server a test starts from trying either.
    env:
      MT_CLAUDE_BIN: ''
      MT_NOTIFY_BIN: ''
    steps:
      # Each action is pinned to a full commit SHA, with its version in the comment.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Reads the files git tracks, so it has to run in this checkout.
      - name: Check the repo is safe to publish
        run: npm run check:public

      # Playwright's own Chromium, so the runner doesn't need Google Chrome (see playwright.config.ts).
      - name: Install the browser for the browser tests
        run: npx playwright install chromium

      - name: Browser tests
        run: npm run test:e2e

      # Playwright leaves a trace of each failed test here.
      - name: Upload the browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
